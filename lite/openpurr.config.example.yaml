# openpurr config: apps, products, entitlements and offerings.
#
# Copy to openpurr.config.yaml and edit. It's compiled into the Worker at deploy time
# (scripts/build-config.mjs), and mistakes fail the deploy with a message saying what's wrong.
# Store credentials never go here; they're Worker secrets.

version: 1

apps:
  # App IDs are your choice; they appear in entitlements and offerings below.
  ios:
    store: app_store
    bundle_id: com.example.myapp          # every signed transaction must carry this bundle ID
    # Public SDK keys for Purchases.configure(). They ship inside your app, so they're
    # identifiers, not secrets. Use appl_ for App Store apps and goog_ for Google Play apps,
    # followed by a long random string. Never start a key with test_.
    sdk_keys:
      - appl_replace_with_a_long_random_string
    # App Store Server API access, used for StoreKit 1 receipts, restores and setup checks.
    # Create an In-App Purchase key in App Store Connect > Users and Access > Integrations, then
    # store the .p8 file's contents as a Worker secret: `wrangler secret put APPLE_IAP_KEY`.
    # The key itself never goes in this file.
    # app_store_server_api:
    #   issuer_id: 57246542-96fe-1a63-e053-0824d011072a
    #   key_id: 2X9R4HXF34
    #   private_key_secret: APPLE_IAP_KEY     # the default
    products:
      pro_monthly: { type: subscription }
      pro_annual: { type: subscription }
      lifetime: { type: non_consumable }
      coins_100: { type: consumable }
      # Optional for subscriptions: the subscription group ID from App Store Connect, used for
      # intro-offer eligibility. It's learned automatically from the first purchase otherwise.
      # pro_monthly: { type: subscription, subscription_group: "21000000" }

  android:
    store: play_store
    package_name: com.example.myapp
    sdk_keys:
      - goog_replace_with_a_long_random_string
    # Google Play Developer API access, used to verify every purchase, acknowledge it, and follow
    # Real-time Developer Notifications. Without it, purchases from this app are refused (and stay
    # queued on the device).
    #   1. In Google Cloud, create a service account and a JSON key. In Play Console, invite the
    #      service account under Users and permissions with "View app information", "View financial
    #      data" (for prices) and "Manage orders and subscriptions".
    #   2. Store the JSON key as a Worker secret: wrangler secret put GOOGLE_SERVICE_ACCOUNT
    #   3. For notifications: create a Pub/Sub topic, set it in Play Console > Monetization setup >
    #      Real-time developer notifications, and add a PUSH subscription to
    #      https://<your worker>/notifications/google with authentication enabled, using a service
    #      account you name below.
    # google_play_api:
    #   service_account_secret: GOOGLE_SERVICE_ACCOUNT        # the default
    #   pubsub_push_account: rtdn-push@my-project.iam.gserviceaccount.com
    #   # pubsub_audience: https://...                        # if you set a custom audience
    #
    # Development only, and only without google_play_api: accept purchases unverified. Anyone with
    # the public SDK key could then grant themselves entitlements.
    # allow_unverified_purchases: true
    products:
      pro: { type: subscription, base_plans: [monthly, annual] }
      lifetime: { type: non_consumable }
      coins_100: { type: consumable }

entitlements:
  pro:
    description: Pro features
    products:
      ios: [pro_monthly, pro_annual, lifetime]
      android: [pro, lifetime]              # "pro" = every base plan; "pro:monthly" = just one

offerings:
  - id: default
    current: true
    description: Standard plans
    metadata: {}
    packages:
      - { id: $rc_monthly, ios: pro_monthly, android: "pro:monthly" }
      - { id: $rc_annual, ios: pro_annual, android: "pro:annual" }
      - { id: $rc_lifetime, ios: lifetime, android: lifetime }

# Webhooks: RevenueCat-shaped events (INITIAL_PURCHASE, RENEWAL, CANCELLATION, EXPIRATION,
# BILLING_ISSUE, PRODUCT_CHANGE, TRANSFER...) POSTed to your backend, so existing RevenueCat
# webhook handlers work unchanged. Delivered at least once (deduplicate on event.id), retried for
# about 72 hours.
# webhooks:
#   - id: backend
#     url: https://api.example.com/webhooks/revenuecat
#     # Worker secret holding the exact Authorization header value to send (optional):
#     #   wrangler secret put WEBHOOK_AUTH
#     authorization_secret: WEBHOOK_AUTH
#     # Worker secret holding an HMAC key (optional). Requests then carry
#     # X-RevenueCat-Webhook-Signature: t=<unix>,v1=<hex>, an HMAC-SHA256 of "<t>.<body>".
#     # During a key rotation, set it to "old-key,new-key" and both signatures are sent.
#     signing_secret: WEBHOOK_SIGNING_SECRET
#     environments: [production, sandbox]   # the default
#     # events: [INITIAL_PURCHASE, RENEWAL]   # all event types when omitted
