# The Xcode project is generated from this file: `xcodegen` in apps/ios (brew install xcodegen).
# Openpurr.xcodeproj is committed too, so building needs only Xcode; regenerate it after changing
# this file or adding source files.
name: Openpurr
options:
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Openpurr.xcconfig
  Release: Config/Openpurr.xcconfig
packages:
  OpenpurrKit:
    path: OpenpurrKit
targets:
  Openpurr:
    type: application
    platform: iOS
    sources:
      - path: Openpurr
    dependencies:
      - package: OpenpurrKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: openpurr
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: Openpurr/Openpurr.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: true
