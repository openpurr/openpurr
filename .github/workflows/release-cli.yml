name: Publish CLI

# Publishes the openpurr CLI (cli/) to npm when a GitHub release is published. The release tag
# (v0.2.0) must match cli/package.json's version (0.2.0); a mismatch fails before anything is
# published. Run it by hand (Actions → Publish CLI → Run workflow) to publish an existing tag, for
# example a release made before this workflow existed. A version that's already on npm is skipped.
#
# Authentication, either:
#   - npm trusted publishing (no secret): on npmjs.com, the @openpurr/cli package → Settings → Trusted
#     publisher → GitHub Actions, repository openpurr/openpurr, workflow release-cli.yml,
#     environment npm. npm only offers this for a package that already exists, so the very first
#     publish needs the token below (or a manual `npm publish` in cli/).
#   - NPM_TOKEN: a granular access token with read and write access to the package, as an
#     environment secret on the "npm" environment (or a repository secret). Used when it's set.
# Either way the package gets a provenance attestation, linking it to this workflow run.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@openpurr/cli
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::The tag must look like v1.2.3 (got '$TAG')."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11.6.2

      - name: Check the version matches the tag
        id: version
        working-directory: cli
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::cli/package.json is $version but the tag is $TAG. Bump the version in a PR first, then tag that commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@openpurr/cli@$version" version > /dev/null 2>&1; then
            echo "::notice::@openpurr/cli@$version is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # The CLI has no dependencies, so there's nothing to install.
      - name: Typecheck and test
        if: steps.version.outputs.published != 'true'
        working-directory: cli
        run: npm run typecheck && npm test

      - name: Publish
        if: steps.version.outputs.published != 'true'
        working-directory: cli
        env:
          # Empty when there's no NPM_TOKEN secret; npm then uses trusted publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          prerelease=$(printf '%s' "$TAG" | grep -q -- '-' && echo "--tag next" || true)
          npm publish --provenance --access public $prerelease
          echo "::notice::Published @openpurr/cli@${{ steps.version.outputs.version }}: https://www.npmjs.com/package/@openpurr/cli"
