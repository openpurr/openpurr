name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lite:
    name: Lite (typecheck, tests, bundle budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Uses the pnpm version pinned in package.json's "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Runs inside workerd with a local D1. Test-only keys are generated on the fly.
      - name: Test
        run: pnpm test

      # Fails if the production Worker bundle grows past its budget (CONTRIBUTING rule 6).
      # Builds with `wrangler deploy --dry-run`, so no Cloudflare credentials are needed.
      - name: Bundle budget
        run: pnpm check:bundle

      # Fails only if a translation has different {placeholders} than the English; missing and
      # outdated strings are reported (see lite/scripts/office-strings.mjs).
      - name: Dashboard translations
        run: node lite/scripts/office-strings.mjs

  standard:
    name: Standard (vet, tests on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: standard
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openpurr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENPURR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/openpurr_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: standard/go.mod
          cache-dependency-path: standard/go.sum

      - name: Vet
        run: go vet ./...

      # Each test runs in its own Postgres schema, so packages can run in parallel.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/openpurr

  standard-image:
    name: Standard (container image builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # Builds standard/Dockerfile from the repository root, as releases do, without pushing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: standard/Dockerfile
          push: false

  infra:
    name: Infra (OpenTofu fmt, validate, offline tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -recursive -check

      # No backend and no credentials: providers are downloaded, nothing in Google Cloud is touched.
      - name: Validate
        run: tofu init -backend=false -input=false && tofu validate

      # The Google provider is mocked (tests/plan.tftest.hcl).
      - name: Test
        run: tofu test

  conformance-lite:
    name: Conformance suite against Lite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Boots Lite in conformance mode (wrangler dev, local D1, test-only keys generated on the fly)
      # and runs spec/conformance against it over HTTP.
      - name: Conformance suite
        run: pnpm --filter @openpurr/conformance test:lite
