name: Deploy website

# Deploys website/ to Cloudflare (Workers static assets, openpurr.org).
# Runs on merges to main that touch the site, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/website-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits for the running deploy instead of cancelling it.
concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website
      url: https://openpurr.org
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Uses the pnpm version pinned in package.json's "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Only the website's dependencies; Lite's aren't needed here.
      - name: Install
        run: pnpm install --frozen-lockfile --filter @openpurr/website...

      # astro check + astro build into website/dist.
      - name: Build
        run: pnpm --filter @openpurr/website build
        env:
          # Google Tag Manager container (GTM-XXXXXXX) or GA4 measurement ID (G-XXXXXXX), as a
          # repository variable or secret named GOOGLE_TAG_ID (Settings → Secrets and variables →
          # Actions). It isn't secret (it's in the page source), so a variable is enough. Loaded only
          # after a visitor accepts the consent banner; off when it's unset.
          PUBLIC_GOOGLE_TAG_ID: ${{ vars.GOOGLE_TAG_ID || secrets.GOOGLE_TAG_ID }}

      - name: Deploy
        working-directory: website
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
